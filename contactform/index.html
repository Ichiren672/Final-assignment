<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ　|　フォーム</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="../js/script.js" defer></script>
    <script src="./js/script.js" defer></script>
</head>
<body>
    <header class="header" id="header"></header>
    <div class="container">
        <main class="contents">
            <h2>お問い合わせフォーム</h2>
            <div class="about">
                <p>
                    配布ソフトやサイトについて、その他については、こちらのフォームサイトから運営者に送信できます。<br>
                    また、フォームが送信不可や返信がない場合には、下記のメールアドレスに送信することも可能です。
                </p>
                <div><a href="mailto:example@exanple.net">example@example.net</a></div>
            </div>
            <h3>送信フォーム入力欄</h3>
            <form action="https://api.staticforms.dev/submit" method="post">
                <input type="hidden" name="apiKey" value="sf_480dba7e7ee1500f81c0fadd" />
                <input type="hidden" name="subject" value="Contact form submission" />
                <div>
                    <label for="email">メールアドレス</label>
                    <input type="email" placeholder="例）example@example.com" id="email" name="email" required>
                </div>
                <div>
                    <label for="title">タイトル</label>
                    <input type="text" placeholder="例）「example」ソフトのバグについて" id="title" name="title" required>
                </div>
                <div>
                    <label for="main">内容</label>
                    <textarea name="main" id="main" placeholder="内容を入力してください" required></textarea>
                </div>
                <div class="sendbtn">
                    <div class="agree">
                        <input type="checkbox" id="agree" value="OK">
                        <label for="agree"><a href="../termsofservice/">利用規約</a>、<a href="../privacypolicy/">プライバシーポリシー</a>に同意する</label>
                    </div>
                    <input type="submit" id="send" value="送信する" disabled>
                </div>
            </form>
            
        </main>
        <aside class="toc" id="sidearea"></aside>
    </div>
    <footer id="footarea"></footer>
    <a href="#" class="gotop">▲TOPに戻る▲</div>
</body>
</html>
